<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Night highway">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05060a"/>
      <stop offset="1" stop-color="#1a0f2e"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14141c"/>
      <stop offset="1" stop-color="#26222e"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#sky)"/>
  <circle cx="44" cy="18" r="7" fill="#f3efd6"/>
  <circle cx="41" cy="16" r="6" fill="url(#sky)"/>
  <!-- road -->
  <polygon points="28,30 36,30 52,64 12,64" fill="url(#road)"/>
  <!-- center dashes -->
  <g fill="#7df9ff">
    <polygon points="31.6,34 32.4,34 32.7,38 31.3,38"/>
    <polygon points="31.0,42 33.0,42 33.5,48 30.5,48"/>
    <polygon points="30.2,52 33.8,52 34.5,62 29.5,62"/>
  </g>
  <!-- lamp glow -->
  <circle cx="22" cy="32" r="2.4" fill="#ffb84d"/>
  <circle cx="42" cy="32" r="2.4" fill="#ffb84d"/>
</svg>

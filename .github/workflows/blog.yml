name: Blog

# blog/posts/*.md（またはジェネレータ）が変わったら HTML を自動生成してコミットする。
# これにより GitHub の Web エディタやスマホから md を追加・編集するだけで公開される。
# ローカルで `npm run make:blog` 済みの push なら差分ゼロ → 何もコミットされない。
on:
  push:
    branches: [main]
    paths:
      - "blog/posts/**"
      - "scripts/make-blog.js"

permissions:
  contents: write

concurrency:
  group: blog-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # make-blog が使うのは marked（純JS）のみ。headless-gl のネイティブビルドを
      # --ignore-scripts で回避して高速化する
      - name: Install npm deps (no native builds)
        run: npm ci --ignore-scripts

      - name: Generate blog HTML
        run: npm run make:blog

      # 生成結果に差分があるときだけコミット。GITHUB_TOKEN の push は
      # ワークフローを再トリガーしないため無限ループにはならない
      - name: Commit generated HTML
        run: |
          if [ -n "$(git status --porcelain blog)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add blog
            git commit -m "blog: HTML を自動生成 (make:blog)"
            git push
          else
            echo "生成結果に差分なし（ローカルで生成済み）"
          fi

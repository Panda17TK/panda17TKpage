name: CI

on:
  push:
    branches: [main]      # PR では pull_request 側で1回だけ走らせ、二重起動を避ける
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # headless-gl (gl) のビルド/実行に必要なシステムライブラリ
      - name: Install system deps for headless-gl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libgl1-mesa-dev libxi-dev libxext-dev libglu1-mesa-dev xvfb

      - name: Install npm deps
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Uniform sync check
        run: npm run test:uniforms

      # 生成ロジックを実際に実行し、コミット済み生成物との乖離を検知する
      # （blog.yml の bot push は CI を再トリガーしないため、ここで実行時検証を担保）
      - name: Blog generation check
        run: |
          npm run make:blog
          git diff --exit-code blog sitemap.xml

      - name: HTML / link check
        run: npm run test:html

      - name: Headless render smoke test
        run: xvfb-run -a -s "-screen 0 1280x1024x24" npm run test:render
